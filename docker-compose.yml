services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: coinbank
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 관측 한 상자: OpenTelemetry Collector + Prometheus(지표) + Tempo(트레이스) + Loki(로그) + Grafana(화면).
  # 앱이 4318 포트로 지표와 트레이스를 보내고, http://localhost:3000 에서 본다.
  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"

  # 부하 테스트 도구. 평소에는 뜨지 않고, 아래 명령으로 실행할 때만 뜬다.
  #   docker compose run --rm k6 run /scripts/transfer.js
  k6:
    image: grafana/k6:1.8.3
    profiles: ["load"]
    volumes:
      - ./k6:/scripts:ro
    environment:
      # 컨테이너 안에서 호스트에 떠 있는 앱(./gradlew bootRun)을 부른다.
      BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-data:
