spring:
  application:
    name: coinbank
  config:
    # 프로젝트 루트의 .env를 프로퍼티로 읽는다. docker-compose.yml과 같은 값을 쓴다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/coinbank
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      # Redis 접속 정보. 송금의 Redis 분산 락(lock-strategy=redis)과 특판 적금의 남은 자리가 쓴다.
      # 처음 쓸 때 연결하므로, 특판을 쓰지 않고 비관·낙관 락으로만 송금하면 Redis 없이도 앱이 뜬다.
      host: localhost
      port: 6379
      repositories:
        # Redis는 락과 숫자 세기에만 쓴다. Redis용 리포지토리 탐색을 끈다.
        enabled: false
  kafka:
    # docker-compose의 Kafka. 메시지를 처음 보낼 때 연결하므로, Kafka가 없어도 앱은 뜬다.
    bootstrap-servers: localhost:9092
  jpa:
    open-in-view: false
    hibernate:
      # M1 동안만 엔티티에서 테이블을 자동으로 만든다.
      ddl-auto: update

# 관측. 지표와 트레이스를 OTLP로 docker-compose의 otel-lgtm에 보낸다. 테스트에서는 스프링 부트가 내보내기를 꺼 둔다.
management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        # 지표를 10초마다 보낸다 (기본 1분). 짧은 부하 테스트도 그래프에 여러 점이 찍히게 한다.
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      # 요청 10건 중 1건만 트레이스를 남긴다. 전부 남기면 부하 테스트 수치에 영향을 준다.
      probability: 0.1
  metrics:
    distribution:
      percentiles-histogram:
        # HTTP 응답 시간을 구간별 개수로도 보낸다. Grafana에서 p95를 계산하려면 필요하다.
        http.server.requests: true

coinbank:
  # 송금할 때 계좌를 보호하는 방식: pessimistic(비관 락) | optimistic(낙관 락) | redis(Redis 분산 락)
  lock-strategy: pessimistic
  # 잔액을 어디서 읽는가 (ADR 001): ledger-and-column(C안, 원장 + 잔액 컬럼) | ledger-only(B안, 원장 합산만)
  balance-model: ledger-and-column
