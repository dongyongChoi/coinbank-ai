spring:
  application:
    name: coinbank
  config:
    # 프로젝트 루트의 .env를 프로퍼티로 읽는다. docker-compose.yml과 같은 값을 쓴다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/coinbank
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # M1 동안만 엔티티에서 테이블을 자동으로 만든다.
      ddl-auto: update
