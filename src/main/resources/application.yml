spring:
  application:
    name: coinbank
  config:
    # 프로젝트 루트의 .env를 프로퍼티로 읽는다. docker-compose.yml과 같은 값을 쓴다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/coinbank
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      # Redis 접속 정보. 송금의 Redis 분산 락(lock-strategy=redis)과 특판 적금의 남은 자리가 쓴다.
      # 처음 쓸 때 연결하므로, 특판을 쓰지 않고 비관·낙관 락으로만 송금하면 Redis 없이도 앱이 뜬다.
      host: localhost
      port: 6379
      repositories:
        # Redis는 락과 숫자 세기에만 쓴다. Redis용 리포지토리 탐색을 끈다.
        enabled: false
  kafka:
    # docker-compose의 Kafka. 메시지를 처음 보낼 때 연결하므로, Kafka가 없어도 앱은 뜬다.
    # 메시지 내용(value)의 직렬화는 적지 않는다. spring-modulith-events-kafka가 바이트로 바꾸고,
    # 그 위에서 이벤트를 JSON으로 만들어 보낸다 (spring.modulith.events.kafka.enable-json 기본값 true).
    bootstrap-servers: localhost:9092
    producer:
      properties:
        # Kafka가 대답하지 않을 때 기다리는 시간. 기본값(1~2분)이면 못 보낸 이벤트가 그동안 "보내는 중"으로 묶여 있다.
        # 처음 연결해서 토픽 정보를 받아 올 때까지 기다리는 시간
        max.block.ms: 5000
        # 요청 하나에 대답을 기다리는 시간
        request.timeout.ms: 5000
        # 보내기 시작부터 성공·실패가 정해질 때까지의 전체 시간. request.timeout.ms보다 길어야 한다.
        delivery.timeout.ms: 10000
  jpa:
    open-in-view: false
    hibernate:
      # M1 동안만 엔티티에서 테이블을 자동으로 만든다.
      ddl-auto: update

# 관측. 지표와 트레이스를 OTLP로 docker-compose의 otel-lgtm에 보낸다. 테스트에서는 스프링 부트가 내보내기를 꺼 둔다.
management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        # 지표를 10초마다 보낸다 (기본 1분). 짧은 부하 테스트도 그래프에 여러 점이 찍히게 한다.
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      # 요청 10건 중 1건만 트레이스를 남긴다. 전부 남기면 부하 테스트 수치에 영향을 준다.
      probability: 0.1
  metrics:
    distribution:
      percentiles-histogram:
        # HTTP 응답 시간을 구간별 개수로도 보낸다. Grafana에서 p95를 계산하려면 필요하다.
        http.server.requests: true

coinbank:
  # 송금할 때 계좌를 보호하는 방식: pessimistic(비관 락) | optimistic(낙관 락) | redis(Redis 분산 락)
  lock-strategy: pessimistic
  # 잔액을 어디서 읽는가 (ADR 001): ledger-and-column(C안, 원장 + 잔액 컬럼) | ledger-only(B안, 원장 합산만)
  balance-model: ledger-and-column
  events:
    # 못 보낸 이벤트를 다시 보내는 주기 (EventResubmission)
    resubmit-interval: 10s
    # 이만큼 지나도 완료 표시가 없는 이벤트만 다시 보낸다. delivery.timeout.ms(10초)보다 길게 둔다.
    resubmit-older-than: 30s
